<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 871 871" width="871" height="871" role="img" aria-label="Fontainebleau Live">
<!-- Leaf: 256 px raster (plenty for a 64 px mark on a x3 screen). Pulse: vector, drawn by CSS.
     Plays three times on arrival, then draws once more and STAYS drawn: live on arrival, calm
     after. Reduced motion: no animation, the pulse is simply there. Path length 1528.6. -->
<style>
.pulse{fill:none;stroke:#1D3B29;stroke-width:20;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1530;stroke-dashoffset:0;
animation:pulseDraw 3.2s ease-in-out .4s 3,pulseSettle 1.3s ease-out 10s forwards}
@keyframes pulseDraw{0%,8%{stroke-dashoffset:1530}48%,74%{stroke-dashoffset:0}100%{stroke-dashoffset:1530}}
@keyframes pulseSettle{from{stroke-dashoffset:1530}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;stroke-dashoffset:0}}
</style>
<image href="data:image/png;base64," x="0" y="0" width="871" height="871"/>
<path class="pulse" d="M166 711L345 540 326 475 414 548 343 333 502 571 441 369 524 449 505 382 645 253"/>
</svg>
