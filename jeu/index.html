<script type="application/json" id="jeu-data">{"spots":[{"id":"cour-des-adieux","name":"Cour des Adieux","set":"napoleon","type":"Monument","rarity":"commun","zone":"ville","lat":48.40204,"lng":2.6981,"icon":"castle","text":{"fr":"Le 20 avril 1814, avant de partir pour l’île d’Elbe, Napoléon descend l’escalier de cette cour et fait ses adieux à sa Vieille Garde. La cour du Cheval Blanc devient alors la cour des Adieux. L’escalier lui-même est plus ancien : il date de Louis XIII (1632-1634).","en":"On 20 April 1814, before leaving for Elba, Napoleon came down the staircase of this courtyard and bade farewell to his Old Guard. The White Horse Courtyard then became the Courtyard of Farewells. The staircase itself is older: it dates from Louis XIII (1632-1634)."},"src":[{"label":"Fondation Napoléon, « Les adieux de Fontainebleau à la Vieille Garde »","url":null},{"label":"Château de Fontainebleau","url":null}],"q":{"fr":"Regardez le grand escalier de la façade : quelle forme a-t-il ?","en":"Look at the great staircase on the façade: what shape is it?","c":{"fr":["En fer à cheval","En colimaçon","Tout droit"],"en":["Horseshoe","Spiral","Straight"]},"a":0}},{"id":"jardin-de-diane","name":"Jardin de Diane","set":"chateau","type":"Jardin","rarity":"commun","zone":"ville","lat":48.40295,"lng":2.69973,"icon":"stag","text":{"fr":"Au centre de l’ancien jardin de la Reine se dresse Diane chasseresse, en bronze. Autour du socle, quatre chiens et quatre têtes de cerf, œuvre du sculpteur Pierre Biard.","en":"At the centre of the former Queen’s Garden stands Diana the Huntress, in bronze. Around the base, four hounds and four stag heads, the work of the sculptor Pierre Biard."},"src":[{"label":"Metropolitan Museum of Art, « Diana with a Hound » (Barthélemy Prieur, notice)","url":"https://www.metmuseum.org/art/collection/search/191166"}],"q":{"fr":"Combien de chiens entourent le socle de la fontaine ?","en":"How many dogs surround the base of the fountain?","c":{"fr":["Deux","Quatre","Six"],"en":["Two","Four","Six"]},"a":1}},{"id":"theatre","name":"Théâtre municipal","set":"ville","type":"Patrimoine urbain","rarity":"commun","zone":"ville","lat":48.40335,"lng":2.69762,"icon":"mask","text":{"fr":"Un concours d’architecture en 1905, un chantier de 1910 à 1912, une inauguration le 9 mars 1912 : le théâtre de Fernand Lucas et Paul Marion est l’un des rares théâtres à l’italienne d’Île-de-France hors de Paris. Il est protégé au titre des monuments historiques.","en":"An architecture competition in 1905, building work from 1910 to 1912, an opening night on 9 March 1912: Fernand Lucas and Paul Marion’s theatre is one of the few Italian-style theatres in the Paris region outside Paris itself. It is a listed historic monument."},"src":[{"label":"Inventaire général du patrimoine culturel, Région Île-de-France","url":null},{"label":"Base Mérimée, PA00087345","url":"https://pop.culture.gouv.fr/notice/merimee/PA00087345"}],"q":{"fr":"De quoi est faite la façade du théâtre ?","en":"What is the theatre’s façade made of?","c":{"fr":["De brique et de pierre","De béton","De bois"],"en":["Brick and stone","Concrete","Wood"]},"a":0}},{"id":"obelisque","name":"Obélisque de Marie-Antoinette","set":"chateau","type":"Monument","rarity":"commun","zone":"ville","lat":48.39705,"lng":2.69227,"icon":"obelisk","text":{"fr":"Haut de 21 mètres, l’obélisque est élevé en 1785-1786 en l’honneur de Marie-Antoinette et de ses enfants, au carrefour où se croisent les grandes routes de la forêt. Des bornes y indiquent les directions ; leurs fleurs de lys sont ôtées en 1793.","en":"Twenty-one metres high, the obelisk was raised in 1785-1786 in honour of Marie-Antoinette and her children, at the crossroads where the forest’s main roads meet. Milestones show the directions; their fleurs-de-lis were removed in 1793."},"src":[{"label":"Base Mérimée, PA00086970 (quatre bornes indicatrices)","url":"https://pop.culture.gouv.fr/notice/merimee/PA00086970"},{"label":"Musée du Patrimoine","url":null}],"q":{"fr":"Autour de l’obélisque, combien de bornes indiquent les routes ?","en":"Around the obelisk, how many milestones show the roads?","c":{"fr":["Deux","Quatre","Huit"],"en":["Two","Four","Eight"]},"a":1}},{"id":"donjon","name":"Le donjon (cour Ovale)","set":"chateau","type":"Monument","rarity":"peu commun","zone":"ville","lat":48.40222,"lng":2.70104,"icon":"keep","text":{"fr":"Au cœur de la cour Ovale se dresse la grosse tour carrée du donjon, la partie la plus ancienne du château : une charte de Louis VII l’atteste dès 1137. En 1528, François Ier fait abattre presque tout le château médiéval et reconstruire sur ses fondations, mais il garde le donjon.","en":"At the heart of the Oval Courtyard rises the keep’s great square tower, the oldest part of the château: a charter of Louis VII records it as early as 1137. In 1528, François I had almost all of the medieval castle pulled down and rebuilt on its foundations, but he kept the keep."},"src":[{"label":"Château de Fontainebleau, « Le palais médiéval »","url":"https://www.chateaudefontainebleau.fr/en/?p=16251"},{"label":"Encyclopædia Universalis","url":null}],"q":{"fr":"Quelle forme a la vieille tour du donjon ?","en":"What shape is the old tower of the keep?","c":{"fr":["Carrée","Ronde","Octogonale"],"en":["Square","Round","Octagonal"]},"a":0}},{"id":"galerie-francois-1er","name":"Galerie François Ier","set":"chateau","type":"Monument","rarity":"rare","zone":"ville","lat":48.40255,"lng":2.69905,"icon":"gallery","text":{"fr":"Commencée vers 1528 pour relier les appartements de François Ier à la chapelle, la galerie mesure environ 61 mètres sur 6. Le peintre florentin Rosso Fiorentino et son atelier la décorent de 1533 à 1539 : fresques et stucs mêlés, une première en France.","en":"Begun around 1528 to link François I’s apartments to the chapel, the gallery is about 61 metres long and 6 wide. The Florentine painter Rosso Fiorentino and his workshop decorated it from 1533 to 1539: frescoes and stucco combined, a first in France."},"src":[{"label":"Vassar College, catalogue Rosso Fiorentino (E. Carroll), « The Gallery of Francis I »","url":null},{"label":"Château de Fontainebleau","url":null}]},{"id":"fresque-napoleon","name":"Fresque de Napoléon","set":"napoleon","type":"Peinture murale","rarity":"commun","zone":"ville","lat":48.4034,"lng":2.69724,"icon":"fresco","text":{"fr":"Une grande fresque peinte sur un mur de la ville : Napoléon à cheval, coiffé de son bicorne.","en":"A large mural painted on a town wall: Napoleon on horseback, wearing his bicorne hat."},"src":[{"label":"Observation sur place, chef de projet de Fontainebleau Live (23/11/2026)","url":null}],"q":{"fr":"Sur la fresque, Napoléon est à cheval. Que porte-t-il sur la tête ?","en":"On the mural, Napoleon is on horseback. What is he wearing on his head?","c":{"fr":["Son bicorne","Une couronne","Un casque"],"en":["His bicorne","A crown","A helmet"]},"a":0}},{"id":"jardin-anglais","name":"Jardin anglais","set":"napoleon","type":"Jardin","rarity":"commun","zone":"ville","lat":48.39922,"lng":2.69615,"icon":"park","text":{"fr":"Sous Napoléon, l’architecte Hurtault dessine ce jardin à l’anglaise, en 1810-1812 : des arbres rares, des allées sinueuses, une rivière artificielle. Dans un recoin se cache la fontaine Belle-Eau, qui a donné son nom au château.","en":"Under Napoleon, the architect Hurtault designed this English-style garden in 1810-1812: rare trees, winding paths, an artificial river. Tucked away in a corner is the Belle-Eau fountain, which gave the château its name."},"src":[{"label":"Château de Fontainebleau, cartes interactives (« Jardin anglais »)","url":"https://www.chateaudefontainebleau.fr/en/?p=16445"},{"label":"Wikipedia, « Maximilien Joseph Hurtault »","url":"https://en.wikipedia.org/wiki/Maximilien_Joseph_Hurtault"}],"q":{"fr":"Qu’est-ce qui traverse le jardin ?","en":"What runs through the garden?","c":{"fr":["Une rivière","Une voie ferrée","Une route"],"en":["A river","A railway","A road"]},"a":0}},{"id":"salle-du-trone","name":"Salle du Trône","set":"napoleon","type":"Salle du château","rarity":"rare","zone":"ville","lat":48.4025,"lng":2.7001,"icon":"throne","text":{"fr":"Napoléon n’aimait pas le décor de l’ancienne chambre du roi : en 1808, il en fait sa salle du Trône, l’une des rares de l’Empire. Le trône, fabriqué en 1804 pour Saint-Cloud, y est installé la même année.","en":"Napoleon disliked the décor of the former king’s bedchamber: in 1808 he made it his throne room, one of the few of the Empire. The throne, made in 1804 for Saint-Cloud, was installed here that same year."},"src":[{"label":"Château de Fontainebleau, « Napoleon I at Fontainebleau: 10 things you need to know »","url":"https://www.chateaudefontainebleau.fr/en/?p=88436"},{"label":"Google Arts & Culture, « Napoleon’s throne chair » (château de Fontainebleau)","url":"https://artsandculture.google.com/asset/napoleon-s-throne-chair/PAH2fxTN5-tLyw"}]},{"id":"grand-ferrare","name":"Porte de l’hôtel du Grand Ferrare","set":"ville","type":"Patrimoine urbain","rarity":"commun","zone":"ville","lat":48.40435,"lng":2.69802,"icon":"door","text":{"fr":"Ce portail est tout ce qui reste du Grand Ferrare, le palais que l’architecte italien Sebastiano Serlio bâtit pour le cardinal Hippolyte d’Este, dit le cardinal de Ferrare. Le palais devait rester modeste, pour ne pas rivaliser avec le château du roi, juste en face.","en":"This gateway is all that remains of the Grand Ferrare, the palace the Italian architect Sebastiano Serlio built for Cardinal Ippolito d’Este, known as the Cardinal of Ferrara. The palace had to stay modest, so as not to rival the king’s château just opposite."},"src":[{"label":"C. L. Frommel, essai sur Serlio, Digital Serlio, Columbia University","url":"https://library.columbia.edu/libraries/avery/digitalserlio/essays/frommel.html"},{"label":"Base Mérimée, PA00086971 (caserne Boufflers et ancien hôtel de Ferrare)","url":"https://pop.culture.gouv.fr/notice/merimee/PA00086971"}],"q":{"fr":"Que reste-t-il aujourd’hui du palais du Grand Ferrare ?","en":"What is left today of the Grand Ferrare palace?","c":{"fr":["Son portail","Une tour","Sa chapelle"],"en":["Its gateway","A tower","Its chapel"]},"a":0}},{"id":"aigle-noir","name":"Place Napoléon-Bonaparte et l’Aigle Noir","set":"ville","type":"Patrimoine urbain","rarity":"commun","zone":"ville","lat":48.404064,"lng":2.698841,"icon":"mansion","text":{"fr":"La place et son carrousel. En face, l’hôtel de l’Aigle Noir, demeure des seigneurs de Retz de 1555 à 1677, rebaptisée L’Aigle Noir en 1810, sous l’Empire.","en":"The square and its merry-go-round. Opposite, the Hôtel de l’Aigle Noir, home of the lords of Retz from 1555 to 1677, renamed the Black Eagle in 1810, under the Empire."},"src":[{"label":"Fiche « Fontainebleau à pied », Fontainebleau Live","url":"https://fontainebleaulive.fr/balades/"},{"label":"Paris Zigzag, « Hôtel L’Aigle Noir, Fontainebleau »","url":"https://www.pariszigzag.fr/sortir-paris/balade-paris/hotel-l-aigle-noir-fontainebleau/"}],"q":{"fr":"Qu’est-ce qui tourne sur la place ?","en":"What goes round and round on the square?","c":{"fr":["Un carrousel","Une grande roue","Une fontaine"],"en":["A merry-go-round","A Ferris wheel","A fountain"]},"a":0}},{"id":"carrousel","name":"Le carrousel","set":"ville","type":"Manège","rarity":"commun","zone":"ville","lat":48.40367,"lng":2.69914,"icon":"carousel"},{"id":"saint-louis","name":"Église Saint-Louis","set":"ville","type":"Église","rarity":"commun","zone":"ville","lat":48.40565,"lng":2.70145,"icon":"church","text":{"fr":"L’église de la ville, bâtie au début du XVIIᵉ siècle sous Louis XIII, à deux pas du château. Avant elle, les habitants allaient à la messe à Avon.","en":"The town’s church, built in the early 17th century under Louis XIII, a stone’s throw from the château. Before it, the townspeople went to mass in Avon."},"src":[{"label":"Office de tourisme du Pays de Fontainebleau, « Église Saint-Louis »","url":"https://www.fontainebleau-tourisme.com/en/fiche/4686996/saint-louis-church"},{"label":"Base Mérimée, PA00086976","url":"https://pop.culture.gouv.fr/notice/merimee/PA00086976"}],"q":{"fr":"Elle s’appelle Saint-Louis, mais sous quel roi a-t-elle été bâtie ?","en":"It is called Saint-Louis, but under which king was it built?","c":{"fr":["Louis XIII","Saint Louis (Louis IX)","Louis XVI"],"en":["Louis XIII","Saint Louis (Louis IX)","Louis XVI"]},"a":0}},{"id":"hotel-de-ville","name":"Hôtel de ville","set":"ville","type":"Patrimoine urbain","rarity":"commun","zone":"ville","lat":48.40474,"lng":2.70104,"icon":"townhall","text":{"fr":"Au 44 rue Grande, la mairie, reconstruite en 1864, sous Napoléon III.","en":"At 44 rue Grande, the town hall, rebuilt in 1864, under Napoleon III."},"src":[{"label":"Fiche « Fontainebleau à pied », Fontainebleau Live","url":"https://fontainebleaulive.fr/balades/"},{"label":"Office de tourisme du Pays de Fontainebleau, « Architectural Heritage: First and Second Empire »","url":"https://www.fontainebleau-tourisme.com/en/discover-the-region/art-of-living/fontainebleau-between-chateau-and-forest/fontainebleau-ville-imperiale/architectural-heritage-first-and-second-empire/"}],"q":{"fr":"Sous quel empereur la mairie a-t-elle été reconstruite ?","en":"Under which emperor was the town hall rebuilt?","c":{"fr":["Napoléon III","Napoléon Iᵉʳ","Charlemagne"],"en":["Napoleon III","Napoleon I","Charlemagne"]},"a":0}},{"id":"ancienne-prison","name":"Ancienne maison d’arrêt","set":"ville","type":"Monument historique","rarity":"peu commun","zone":"ville","lat":48.40981,"lng":2.70368,"icon":"prison","text":{"fr":"Bâtie au milieu du XIXᵉ siècle, l’ancienne maison d’arrêt a ensuite abrité le Musée national des prisons. Avec ses cours de promenade et son mur d’enceinte, elle est monument historique depuis 1996.","en":"Built in the mid-19th century, the former jail later housed the National Prison Museum. With its exercise yards and outer wall, it has been a listed monument since 1996."},"src":[{"label":"Base Mérimée, PA77000003","url":"https://pop.culture.gouv.fr/notice/merimee/PA77000003"},{"label":"Monumentum, « Ancienne maison d’arrêt à Fontainebleau »","url":"https://monumentum.fr/monument-historique/pa77000003/fontainebleau-ancienne-maison-darret"}]},{"id":"bel-ebat","name":"Parc de Bel-Ébat (Avon)","set":"ville","type":"Parc","rarity":"commun","zone":"ville","lat":48.412,"lng":2.73277,"icon":"park","text":{"fr":"Son nom viendrait de la meute de chasse d’Henri IV. Ce domaine privé autour d’un manoir a été donné à la ville d’Avon en 1979 par sa dernière propriétaire, Lola Dommange. Des ânes y paissent.","en":"Its name is said to come from Henri IV’s hunting pack. This private estate around a manor house was given to the town of Avon in 1979 by its last owner, Lola Dommange. Donkeys graze here."},"src":[{"label":"Sortiraparis.com, « Bel Ebat Park »","url":"https://www.sortiraparis.com/en/what-to-visit-in-paris/walks/articles/344941-bel-ebat-park-a-beautiful-green-space-with-grazing-donkeys-in-avon-77"},{"label":"Office de tourisme du Pays de Fontainebleau, brochure","url":"https://www.fontainebleau-tourisme.com/wp-content/uploads/2022/06/Brochure-finale-Francaise.pdf"}],"q":{"fr":"Quels animaux paissent dans le parc ?","en":"Which animals graze in the park?","c":{"fr":["Des ânes","Des moutons","Des chèvres"],"en":["Donkeys","Sheep","Goats"]},"a":0}},{"id":"mont-ussy","name":"Mont Ussy","set":"denecourt","type":"Site des sentiers bleus","rarity":"peu commun","zone":"foret","lat":48.42699,"lng":2.69645,"icon":"tree","text":{"fr":"Le premier sentier bleu de Denecourt serpente ici entre rochers, grottes et arbres remarquables. Denecourt y baptisait encore des rochers en 1874, quelques mois avant sa mort, le 24 mars 1875.","en":"Denecourt’s first blue trail winds here between rocks, caves and remarkable trees. Denecourt was still naming rocks here in 1874, a few months before his death on 24 March 1875."},"src":[{"label":"Association des Amis de la forêt de Fontainebleau, comptes rendus de promenade au mont Ussy (2022-2023)","url":null},{"label":"AAFF, bulletin du centenaire de la mort de Denecourt (1976)","url":"https://www.aaff.fr/wp-content/uploads/2023/12/vf1976.pdf"}],"q":{"fr":"De quelle couleur sont les marques peintes du sentier Denecourt ?","en":"What colour are the painted marks of the Denecourt trail?","c":{"fr":["Bleu","Rouge","Jaune"],"en":["Blue","Red","Yellow"]},"a":0}},{"id":"tour-denecourt","name":"Tour Denecourt","set":"denecourt","type":"Belvédère","rarity":"rare","zone":"foret","lat":48.43382,"lng":2.72621,"icon":"tower","text":{"fr":"Denecourt, l’inventeur des sentiers bleus, fait bâtir cette tour, inaugurée en 1853 par Napoléon III sous le nom de Fort l’Empereur. Montée sans mortier, elle s’écroule en 1878 ; reconstruite, elle prend en 1882 le nom de son créateur.","en":"Denecourt, the inventor of the blue trails, had this tower built; Napoleon III opened it in 1853 as the Fort l’Empereur. Built without mortar, it collapsed in 1878; rebuilt, it took its creator’s name in 1882."},"src":[{"label":"Office de tourisme du Pays de Fontainebleau, sentier de la tour Denecourt à la croix du Calvaire","url":"https://www.fontainebleau-tourisme.com/en/fiche/6367855/sentier-de-la-tour-denecourt-a-la-croix-du-calvaire/"},{"label":"Fondation Napoléon, F. Houdecek, « Fontainebleau, une forêt très napoléonienne »","url":"https://www.napoleon.org/histoire-des-2-empires/articles/une-chronique-de-francois-houdecek-fontainebleau-une-foret-tres-napoleonienne/"}],"q":{"fr":"En haut de la tour, qu’est-ce qui aide à reconnaître le paysage ?","en":"At the top of the tower, what helps you recognise the landscape?","c":{"fr":["Une table d’orientation","Une longue-vue","Des photos anciennes"],"en":["A viewpoint indicator","A telescope","Old photographs"]},"a":0}},{"id":"rocher-cassepot","name":"Rocher Cassepot","set":"denecourt","type":"Point de vue","rarity":"peu commun","zone":"foret","lat":48.43503,"lng":2.73366,"icon":"view"},{"id":"grotte-serment","name":"Grotte du Serment","set":"denecourt","type":"Site des sentiers bleus","rarity":"rare","zone":"foret","lat":48.40225,"lng":2.66493,"icon":"cave","text":{"fr":"Critiqué pour ses travaux, Denecourt promet en 1853 de ne plus creuser qu’une grotte : celle-ci, sous un plafond fait d’un seul énorme rocher. Il y grave « D.F.D. », Dernière Folie Denecourt. Il ne tient pas parole : plus loin, il creuse la grotte du Parjure.","en":"Criticised for his works, Denecourt promised in 1853 to dig only one more cave: this one, under a ceiling made of a single huge rock. He carved “D.F.D.” into it: Dernière Folie Denecourt, Denecourt’s Last Folly. He did not keep his word: further on, he dug the Cave of Perjury."},"src":[{"label":"Smithsonian Magazine, « The Evolution of Art Techniques »","url":"https://www.smithsonianmag.com/arts-culture/the-evolution-of-art-techniques-180974592/"},{"label":"Visorando, « La grotte du Serment »","url":"https://www.visorando.com/randonnee-grotte-du-serment.html"}],"q":{"fr":"Quelle année est gravée sur le rocher ?","en":"Which year is carved on the rock?","c":{"fr":["1853","1789","1907"],"en":["1853","1789","1907"]},"a":0}},{"id":"croix-d-augas","name":"Croix d’Augas","set":"foret","type":"Carrefour historique","rarity":"peu commun","zone":"foret","lat":48.4249,"lng":2.70897,"icon":"cross","text":{"fr":"Une croix de carrefour, déjà sur le plan de la forêt de 1624. Tout près s’ouvrait la caverne d’Augas, la plus vaste grotte de la forêt selon Denecourt ; ensablée en 1972, elle s’est effondrée en 1986.","en":"A crossroads cross, already on the 1624 map of the forest. Close by opened the Augas cavern, the largest cave in the forest according to Denecourt; filled with sand in 1972, it collapsed in 1986."},"src":[{"label":"Fontainebleau-photo.fr, « La croix d’Augas » (2023), d’après Denecourt et Colinet","url":null},{"label":"AAFF, « L’effondrement de la caverne d’Augas »","url":null},{"label":"AAFF, compte rendu de la promenade Augas, Béhourdière, Cassepot (23/09/2023)","url":"https://www.aaff.fr/wp-content/uploads/2023/12/cr_2023_09_23_promenade-abc.pdf"}],"q":{"fr":"De quoi est faite la croix ?","en":"What is the cross made of?","c":{"fr":["De pierre","De bois","De métal"],"en":["Stone","Wood","Metal"]},"a":0}},{"id":"grand-veneur","name":"Croix du Grand Veneur","set":"foret","type":"Carrefour historique","rarity":"peu commun","zone":"foret","lat":48.43041,"lng":2.66126,"icon":"cross","text":{"fr":"Le grand veneur commandait les chasses du roi. La croix porte déjà son nom sur le plan de la forêt de 1624 ; elle se dresse aujourd’hui au milieu d’un rond-point.","en":"The Grand Huntsman commanded the king’s hunts. The cross already bears his name on the 1624 map of the forest; today it stands in the middle of a roundabout."},"src":[{"label":"Wikipédia, « Croix du Grand-Veneur » (d’après Tendron, 2018)","url":null}],"q":{"fr":"Où se dresse la croix aujourd’hui ?","en":"Where does the cross stand today?","c":{"fr":["Au milieu d’un rond-point","Au sommet d’un rocher","Devant une chapelle"],"en":["In the middle of a roundabout","On top of a rock","In front of a chapel"]},"a":0}},{"id":"franchard","name":"Gorges de Franchard","set":"foret","type":"Gorges","rarity":"rare","zone":"foret","lat":48.40812,"lng":2.62024,"icon":"mountain","text":{"fr":"Des ermites vivent ici dès le XIIᵉ siècle ; la fontaine des Ermites garde leur souvenir. L’ermitage, devenu un repaire de brigands, est rasé au XVIIIᵉ siècle ; la maison forestière date de Louis-Philippe.","en":"Hermits lived here from the 12th century; the Hermits’ Fountain keeps their memory. The hermitage, by then a robbers’ den, was razed in the 18th century; the forester’s house dates from Louis-Philippe."},"src":[{"label":"Office de tourisme du Pays de Fontainebleau, sentier des gorges de Franchard","url":null},{"label":"AAFF, « Autour de Franchard »","url":"https://www.aaff.fr/wp-content/uploads/2023/12/autour-de-franchard-1.pdf"}],"q":{"fr":"Quel bâtiment se dresse aujourd’hui près de l’ancien ermitage ?","en":"What building stands near the old hermitage today?","c":{"fr":["Une maison forestière","Une église","Un moulin"],"en":["A forester’s house","A church","A mill"]},"a":0}},{"id":"apremont","name":"Gorges d’Apremont","set":"foret","type":"Gorges","rarity":"rare","zone":"foret","lat":48.43601,"lng":2.62568,"icon":"mountain","text":{"fr":"Révoltés par les coupes de vieux chênes, Théodore Rousseau et les peintres de Barbizon obtiennent en 1853 que des parties de la forêt soient laissées à la nature, dont les gorges d’Apremont : la « réserve artistique ».","en":"Outraged by the felling of old oaks, Théodore Rousseau and the Barbizon painters won in 1853 that parts of the forest be left to nature, the Apremont gorge among them: the “artistic reserve”."},"src":[{"label":"Metropolitan Museum of Art, « The Barbizon School »","url":null},{"label":"Fondation Napoléon (notice du tableau)","url":null},{"label":"Hérodote.net","url":null}],"q":{"fr":"De quoi sont faits les gros blocs du chaos d’Apremont ?","en":"What are the big boulders of the Apremont rock field made of?","c":{"fr":["De grès","De granit","De calcaire"],"en":["Sandstone","Granite","Limestone"]},"a":0}},{"id":"gorges-du-houx","name":"Gorges du Houx, les abris de carriers","set":"foret","type":"Gorges","rarity":"rare","zone":"foret","lat":48.408,"lng":2.64271,"icon":"hut","text":{"fr":"Le long des gorges du Houx, les carriers ont laissé un vrai « village » d’abris : de petites cabanes en pierres sèches, souvent montées contre un rocher, où ils rangeaient leurs habits, leur repas et leurs outils. Il en reste des centaines dans la forêt.","en":"Along the Houx gorge, the quarrymen left a real “village” of shelters: small dry-stone huts, often built against a rock, where they kept their clothes, their meals and their tools. Hundreds remain in the forest."},"src":[{"label":"Association des Amis de la forêt de Fontainebleau, « Les carriers »","url":null}]},{"id":"croix-du-calvaire","name":"Croix du Calvaire","set":"foret","type":"Point de vue","rarity":"commun","zone":"foret","lat":48.41966,"lng":2.7147,"icon":"cross"},{"id":"croix-de-toulouse","name":"Croix de Toulouse","set":"foret","type":"Carrefour historique","rarity":"peu commun","zone":"foret","lat":48.44395,"lng":2.71838,"icon":"cross"},{"id":"antre-des-druides","name":"Antre des Druides","set":"foret","type":"Grotte","rarity":"peu commun","zone":"foret","lat":48.4066,"lng":2.62242,"icon":"cave"},{"id":"caverne-des-brigands","name":"Caverne des Brigands","set":"foret","type":"Grotte","rarity":"peu commun","zone":"foret","lat":48.43817,"lng":2.6303,"icon":"cave"},{"id":"mare-aux-evees","name":"Mare aux Évées","set":"foret","type":"Mare","rarity":"peu commun","zone":"foret","lat":48.47568,"lng":2.65855,"icon":"pond"},{"id":"mare-aux-fees","name":"Mare aux Fées","set":"foret","type":"Mare","rarity":"rare","zone":"foret","lat":48.35824,"lng":2.71054,"icon":"pond"},{"id":"musee-barbizon","name":"Musée de l’École de Barbizon","set":"peintres","type":"Maison de peintres","rarity":"peu commun","zone":"ville","lat":48.44619,"lng":2.60261,"icon":"palette","text":{"fr":"Vers 1820, la famille Ganne tient une épicerie à Barbizon et loge les artistes venus peindre la forêt : l’auberge devient le rendez-vous des peintres de l’École de Barbizon. Ils y peignent les meubles et les murs de leurs chambres, et ces décors sont toujours là. La maison est aujourd’hui le musée départemental des peintres de Barbizon.","en":"Around 1820, the Ganne family ran a grocery in Barbizon and put up the artists who came to paint the forest: the inn became the meeting place of the Barbizon School painters. They painted the furniture and the walls of their rooms, and those decorations are still there. The house is now the departmental museum of the Barbizon painters."},"src":[{"label":"Office de tourisme du Pays de Fontainebleau, « Barbizon, village de peintres »","url":null},{"label":"Paris Region","url":null},{"label":"Muséofile, ministère de la Culture (M0370)","url":"https://pop.culture.gouv.fr/notice/museo/M0370"}],"q":{"fr":"Dans l’auberge, qu’ont peint les artistes, en plus de leurs tableaux ?","en":"In the inn, what did the artists paint besides their canvases?","c":{"fr":["Les meubles et les murs","Les vitraux","Les volets de la rue"],"en":["The furniture and the walls","The stained glass","The street shutters"]},"a":0}},{"id":"medaillon-millet-rousseau","name":"Médaillon de Millet et Rousseau","set":"peintres","type":"Monument","rarity":"peu commun","zone":"foret","lat":48.44161,"lng":2.61211,"icon":"medallion","text":{"fr":"Au bout de la Grande Rue de Barbizon, un médaillon de bronze du sculpteur Henri Chapu est scellé dans un rocher. Il honore Jean-François Millet et Théodore Rousseau ; les peintres de Barbizon l’ont payé par souscription, et il est inauguré en avril 1884.","en":"At the end of Barbizon’s Grande Rue, a bronze medallion by the sculptor Henri Chapu is set into a rock. It honours Jean-François Millet and Théodore Rousseau; the Barbizon painters paid for it by subscription, and it was unveiled in April 1884."},"src":[{"label":"Wikimedia Commons, « Rousseau and Millet by Henri Chapu »","url":null},{"label":"Office de tourisme, sentier des peintres","url":null},{"label":"Fiche « Fontainebleau en voiture », Fontainebleau Live","url":"https://fontainebleaulive.fr/balades/"}],"q":{"fr":"Quels peintres honore le médaillon ?","en":"Which painters does the medallion honour?","c":{"fr":["Millet et Rousseau","Corot et Daubigny","Monet et Renoir"],"en":["Millet and Rousseau","Corot and Daubigny","Monet and Renoir"]},"a":0}},{"id":"bas-breau","name":"Le Bas-Bréau","set":"peintres","type":"Futaie","rarity":"peu commun","zone":"foret","lat":48.44099,"lng":2.6243,"icon":"tree","text":{"fr":"Un canton de la forêt célèbre pour ses chênes immenses, peints par Corot vers 1832-1833 et par bien d’autres. En 1853, le Bas-Bréau fait partie des 624 hectares de vieilles futaies et de rochers que l’on soustrait aux coupes, à la demande des peintres.","en":"A part of the forest famous for its huge oaks, painted by Corot around 1832-1833 and by many others. In 1853, the Bas-Bréau was among the 624 hectares of old woodland and rocks spared from felling, at the painters’ request."},"src":[{"label":"Metropolitan Museum of Art (Corot, « Le Bas-Bréau », étude)","url":null},{"label":"Wikipédia, « Forêt de Fontainebleau »","url":null}]},{"id":"chailly","name":"Chailly-en-Bière, le village des peintres","set":"peintres","type":"Village","rarity":"peu commun","zone":"ville","lat":48.47127,"lng":2.60807,"icon":"church","text":{"fr":"Jean-François Millet et Théodore Rousseau reposent au cimetière de Chailly-en-Bière, avec d’autres peintres de Barbizon. Au village, l’auberge du Cheval Blanc, où venaient les peintres, est protégée depuis 1984 : ses façades et la salle du restaurant avec son décor.","en":"Jean-François Millet and Théodore Rousseau are buried in the Chailly-en-Bière cemetery, with other Barbizon painters. In the village, the Cheval Blanc inn, where the painters used to come, has been listed since 1984: its façades and the restaurant room with its decoration."},"src":[{"label":"Office de tourisme du Pays de Fontainebleau, « Chailly-en-Bière, village de caractère »","url":null},{"label":"Base Mérimée, PA00086849","url":"https://pop.culture.gouv.fr/notice/merimee/PA00086849"}]},{"id":"bas-cuvier","name":"Bas Cuvier","set":"grimpe","type":"Site de bloc","rarity":"peu commun","zone":"foret","lat":48.44617,"lng":2.63734,"icon":"climb"},{"id":"rocher-canon","name":"Rocher Canon","set":"grimpe","type":"Site de bloc","rarity":"peu commun","zone":"foret","lat":48.46308,"lng":2.66281,"icon":"climb"},{"id":"canche-aux-merciers","name":"Canche aux Merciers","set":"grimpe","type":"Site de bloc","rarity":"peu commun","zone":"foret","lat":48.39102,"lng":2.54895,"icon":"climb"},{"id":"cul-de-chien","name":"Cu     var B = G.boards[code], org = G.org && G.org.code === code ? G.org : null;
    var Q = gq((B && B.q) || (org && org.q)) || playable()[0];
    sheet.textContent = '';
    sheet.appendChild(header(Q.color, 'team', t('gBoardChip'), Q.color));
    var b = el('div', 'body'); sheet.appendChild(b);
    b.appendChild(el('h2', null, org ? t('gMyH') : t('gBoardH')));
    b.appendChild(el('p', 'meta', tr(Q.name) + ' · ' + code));
    if (org) {
      b.appendChild(el('p', 'sh4', t('gOrg1')));
      var lims = el('div', 'glims');
      LIMITS.forEach(function (m) { var x = gbtn('gl', m ? clockMin(m) : t('gNoLim'), function () { org.lim = m; gsave(); openBoard(code); }); x.setAttribute('aria-pressed', org.lim === m); lims.appendChild(x); });
      b.appendChild(lims);
      b.appendChild(el('p', 'sh4', t('gTel')));
      var ti = el('div', 'codein'), tin = el('input'); tin.type = 'tel'; tin.placeholder = '06 12 34 56 78'; tin.style.textTransform = 'none';
      if (org.tel) tin.value = '+' + org.tel;
      ti.appendChild(tin);
      ti.appendChild(gbtn('btn', t('gTelSave'), function () {
        var v = tin.value.trim(), d = telOf(v);
        if (v && !d) { toast(t('gTelBad')); return; }
        org.tel = d; gsave(); toast(t('gTelOk')); openBoard(code);
      }));
      b.appendChild(ti); b.appendChild(el('p', 'small', t('gTelTxt')));
      b.appendChild(el('p', 'sh4', t('gOrg2')));
      b.appendChild(el('p', 'small', t('gOrg2Txt')));
      var a1 = el('div', 'acts'); b.appendChild(a1);
      a1.appendChild(gbtn('btn', t('gInvite'), function () { shareLink(joinUrl(org), t('gShareJoin', tr(Q.name)), 'groupe/invite'); }));
      var cd = el('p', 'small', t('gCodeIs')); cd.appendChild(el('b', null, code)); a1.appendChild(cd);
      a1.appendChild(gbtn('btn soft', t('gPlayToo'), function () { gJoin(code, org.q, org.lim, org.tel); }));
      b.appendChild(el('p', 'sh4', t('gOrg3')));
      b.appendChild(el('p', 'small', t('gOrg3Txt')));
    }
    var list = ranking(code);
    if (!list.length) b.appendChild(el('p', 'meta', t('gBoardEmpty')));
    list.forEach(function (r, i) {
      var row = el('div', 'grow'), rk = el('span', 'grank' + (i < 3 ? ' r' + (i + 1) : ''), String(i + 1)); row.appendChild(rk);
      var tx = el('span', 'gtx'); tx.appendChild(el('b', null, r.n));
      tx.appendChild(el('small', null, clock(r.s) + ' · ' + t('gStepsN', r.d.length, Q.steps.length) + (r.i ? ' · ' + t('gInvN', r.i) : '') + (r.e === 'time' ? ' · ' + t('gTimeUp') : r.e === 'stop' ? ' · ' + t('gStopped') : '')));
      row.appendChild(tx); row.appendChild(el('span', 'gpts', r.p + ' pts')); b.appendChild(row);
    });
    var hl = list.length ? highlights(list, Q) : [];
    hl.forEach(function (x) { b.appendChild(el('p', 'ghl', x)); });
    if (list.length) {
      var a2 = el('div', 'acts'); b.appendChild(a2);
      a2.appendChild(gbtn('btn soft', t('gShareBoard'), function () {
        var txt = tr(Q.name) + String.fromCharCode(10) + list.map(function (r, i) { return (i + 1) + '. ' + r.n + ' : ' + r.p + ' pts (' + clock(r.s) + ')'; }).join(String.fromCharCode(10)) + (hl.length ? String.fromCharCode(10) + hl.join(String.fromCharCode(10)) : '');
        track('groupe/share-board');
        if (navigator.share) navigator.share({ title: t('gBoardH'), text: txt }).catch(function () {}); else copyText(txt, t('gCopied'));
      }));
    }
    sheet.classList.add('on'); sheet.scrollTop = 0;
  }

  // ── On the map and in Quests ──
  var GLAYER = L.layerGroup().addTo(map);
  function groupDraw() {
    GLAYER.clearLayers();
    var T = running(); if (!T) return;
    var p = spotById(gq(T.q).steps[T.done.length]); if (!p) return;
    var m = L.marker([p.lat, p.lng], { zIndexOffset: 3000, icon: L.divIcon({ html: '<div class="gpin">' + (T.done.length + 1) + '</div>', className: '', iconSize: [36, 36], iconAnchor: [18, 18] }) });
    m.on('click', openTeam); GLAYER.addLayer(m);
  }
  function groupBar() {
    var T = team(), gb = $('gbar');
    $('livebar').style.display = T ? 'none' : '';
    if (!T) { gb.hidden = true; return; }
    gb.hidden = false; gb.textContent = '';
    gb.appendChild(el('b', null, T.endAt ? t('gBarEnd') : !T.start ? t('gBarReady') : t('gStep', T.done.length + 1, gq(T.q).steps.length)));
    var s = el('span', null, T.start && !T.endAt ? gstat(T) : ''); s.id = 'gbart'; gb.appendChild(s);
  }
  $('gbar').onclick = function () { openTeam(); };
  function groupCard(root) {
    var T = team(), org = G.org && GCODE.test(G.org.code) ? G.org : null, box = el('div', 'acts');
    if (T) box.appendChild(gbtn('btn', T.endAt ? t('gSeeRes') : T.start ? t('gResume') : t('gReady'), function () { tab('map'); openTeam(); }));
    if (org) box.appendChild(gbtn('btn soft', t('gMyGame'), function () { tab('map'); openBoard(org.code); }));
    if (!T && playable().length) {
      var ci = el('div', 'codein gjoin'), inp = el('input'); inp.placeholder = 'FLC-GRP-XXXXXXXX'; inp.autocapitalize = 'characters'; ci.appendChild(inp);
      ci.appendChild(gbtn('btn', t('gJoin'), function () {
        var c = inp.value.trim().toUpperCase();
        if (!GCODE.test(c)) { toast(t('codeBad')); return; }
        var o = G.org && G.org.code === c ? G.org : { q: playable()[0].id, lim: 0 };
        gJoin(c, o.q, o.lim, o.tel);
      }));
      box.appendChild(ci);
    }
    box.appendChild(gbtn('linkbtn', t('gOrganise'), function () { SHOP_OPEN.group = true; renderShop(); tab('shop'); }));
    quest(root, ['team', '#4a5bb8'], t('gCardH'), [], t('gCardTxt'), 0, 0, box, !!running());
  }
  function groupActive() { return !!(team() || (G.org && GCODE.test(G.org.code))); }
  // Every second while a team plays: the stopwatch, and the time limit
  setInterval(function () {
    var T = running(); if (!T) return;
    if (T.lim && Date.now() - T.start >= T.lim * 60000) { toast(t('gEndTime')); endTeam(T, 'time', T.start + T.lim * 60000); return; }
    var a = $('gbart'), b = $('gstat'); if (a) a.textContent = gstat(T); if (b) b.textContent = gstat(T);
  }, 1000);
  // Links: ?partie= (a team joins), ?resultat= (the organiser receives), ?merci=groupe (paid session)
  function groupInit() {
    var q = new URLSearchParams(location.search), act = null;
    var pc = String(q.get('partie') || '').toUpperCase();
    if (GCODE.test(pc)) {
      var Q = gq(q.get('q')) || playable()[0], lim = +q.get('lim') || 0;
      if (LIMITS.indexOf(lim) < 0) lim = 0;
      var tel = telOf(q.get('tel'));
      if (Q) act = function () { gJoin(pc, Q.id, lim, tel); };
    }
    var rs = q.get('resultat');
    if (rs) {
      var r = okResult(b64d(rs));
      if (r) { addResult(r); act = function () { tab('map'); openBoard(r.c); toast(t('gGot', r.n)); }; }
      else act = function () { toast(t('gBadRes')); };
    }
    var sid = q.get('session_id') || '';
    if (q.get('merci') === 'groupe' && /^cs_(live|test)_[A-Za-z0-9]{10,}$/.test(sid) && playable().length) {
      var code = 'FLC-GRP-' + sid.replace(/[^A-Za-z0-9]/g, '').slice(-8).toUpperCase();
      setOrg(code); track('shop/paid/groupe'); act = function () { tab('map'); openBoard(code); };
    }
    if (pc || rs || q.get('merci') === 'groupe') try { history.replaceState(null, '', location.pathname); } catch (e) {}
    // A game left running while the phone slept: the time limit may have passed
    var T = running(); if (T && T.lim && Date.now() - T.start >= T.lim * 60000) { T.endAt = T.start + T.lim * 60000; T.why = 'time'; gsave(); }
    return act;
  }

  function renderAll() { renderLive(); renderDex(); renderQuests(); renderMe(); renderShop(); hud(); groupBar(); }
  function tab(name) {
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.setAttribute('aria-selected', b.getAttribute('data-tab') === name); });
    Array.prototype.forEach.call(document.querySelectorAll('.screen'), function (s) { s.classList.toggle('on', s.id === 's-' + name); });
    closeSheet(); $('lpanel').classList.remove('on');
    if (name === 'map') setTimeout(function () { map.invalidateSize(); }, 50);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.onclick = function () { tab(b.getAttribute('data-tab')); }; });
  $('mebtn').onclick = function () { tab('me'); };
  $('back').addEventListener('click', function () { track('back-site'); });
  if (LANG === 'en') $('back').href = '/?lang=en';

  (function () {
    var q = new URLSearchParams(location.search), k = q.get('merci'), sid = q.get('session_id') || '';
    if (k === 'mecene' && /^cs_(live|test)_[A-Za-z0-9]{10,}$/.test(sid)) { applyPurchase(k, unlockCode(k, sid)); if (!st.onboarded) { st.onboarded = true; save(); } }
    if (k) try { history.replaceState(null, '', location.pathname + '#boutique'); } catch (e) {}
  })();
  var gAct = groupInit();
  if (gAct && !st.onboarded) { st.onboarded = true; save(); } // a team arriving by its link plays at once
  chrome(); refreshRange(); panel(); liveBar(); draw(); renderAll();
  if (gAct) gAct();
  if (!st.onboarded) { renderOnb(); onb.classList.add('on'); }
  else if (st.geo === 'oui') startGeo();
  // ── Home screen (23/11): Android/Chrome gives a prompt to keep for later; iPhone needs two taps
  // in Safari's Share menu, which a page cannot trigger: there, the card shows them. Offered after
  // the first thing collected, never on arrival; « Plus tard » waits 7 days. Never once installed.
  function canInstall() { return !standalone && (deferred || ios); }
  function instLater() { try { var v = localStorage.getItem(IKEY); return v === 'installed' || (v && Date.now() - (+v) < 7 * 864e5); } catch (e) { return false; } }
  function collected() { return Object.keys(st.spots).length + Object.keys(st.events).length + Object.keys(st.invaders).length; }
  function installCard(force) {
    var box = $('install'); box.textContent = '';
    var img = el('img'); img.src = ICON_192; img.alt = ''; box.appendChild(img);
    box.appendChild(el('b', null, t('instH'))); box.appendChild(el('small', null, t('instSub')));
    var row = el('div', 'row2');
    if (deferred) {
      var add = el('button', 'btn', t('instAdd')); add.type = 'button';
      add.onclick = function () {
        var d = deferred; deferred = null; box.hidden = true; d.prompt();
        if (d.userChoice) d.userChoice.then(function (r) { track('install/' + r.outcome); }, function () {});
      };
      row.appendChild(add);
    } else if (ios) {
      var hint = el('p', 'ios'); hint.appendChild(document.createTextNode(t('instIos1'))); hint.appendChild(ico('share')); hint.appendChild(document.createTextNode(t('instIos2'))); box.appendChild(hint);
    } else {
      box.appendChild(el('p', 'ios', t('instMenu'))); // no prompt from the browser (yet): its own menu does it
    }
    var later = el('button', 'btn soft', t('instLater')); later.type = 'button';
    later.onclick = function () { box.hidden = true; if (!force) { try { localStorage.setItem(IKEY, String(Date.now())); } catch (e) {} track('install/later'); } };
    row.appendChild(later); box.appendChild(row);
    box.hidden = false; track('install/shown');
  }
  function maybeInstall(delay) {
    if (instShown || !st.onboarded || !canInstall() || instLater() || !collected()) return;
    setTimeout(function () {
      if (instShown || luShowing || luQueue.length || $('onb').classList.contains('on')) return;
      instShown = true; closeSheet(); installCard(false);
    }, delay || 3500);
  }
  // The browser offers the install again: the game is not installed (any more). 23/11: after an
  // uninstall the old « installed » note hid the offer for good.
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    try { if (localStorage.getItem(IKEY) === 'installed') localStorage.removeItem(IKEY); } catch (x) {}
    renderMe(); maybeInstall(5000);
  });
  window.addEventListener('appinstalled', function () { $('install').hidden = true; deferred = null; try { localStorage.setItem(IKEY, 'installed'); } catch (e) {} track('install/done'); renderMe(); });
  var gain0 = gain; gain = function (xp, why) { gain0(xp, why); maybeInstall(); };
  maybeInstall(6000);
  // Offline: the site's service worker (network first) keeps a copy of the pages one has opened.
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {}); } catch (e) {}

  // Shareable anchors: #carte, #direct, #collection, #quetes, #profil, #lieu-<id> (a place's sheet).
  function fromHash() {
    var h = location.hash.slice(1), tabs = { carte: 'map', direct: 'live', collection: 'dex', quetes: 'quests', profil: 'me', boutique: 'shop' };
    if (tabs[h]) tab(tabs[h]);
    var p = /^lieu-([a-z0-9-]+)$/.exec(h) && spotById(h.slice(5));
    if (p && st.onboarded) { tab('map'); map.setView([p.lat, p.lng], 16); openSpot(p); }
  }
  fromHash(); window.addEventListener('hashchange', fromHash);
})();

</script>
<script data-goatcounter="https://fontainebleaulive.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>
(function () {
  document.addEventListener('click', function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest('a[data-track]') : null;
    if (!a) return;
    try {
      var name = a.getAttribute('data-track');
      var id = (a.getAttribute('data-id') || '').slice(0, 80);
      if (window.goatcounter && typeof window.goatcounter.count === 'function') {
        window.goatcounter.count({ path: id ? name + '/' + id : name, title: name, event: true });
      }
    } catch (e) { /* measurement is never worth an error */ }
  });
})();
</script>
