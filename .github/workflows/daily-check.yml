name: Check Quotidien & Mise à jour Data Gemini

# Le declencheur reste quotidien, mais le script ne lance un vrai scan (facture) que si les
# donnees ont plus de MIN_RUN_INTERVAL_HOURS (60 h) : soit environ un scan tous les 3 jours.
# Un jour saute ou echoue est ainsi retente des le lendemain, sans attendre 3 jours de plus.
# Un declenchement manuel force toujours le scan.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 07:00/08:00 in Paris
  workflow_dispatch:

# Least privilege: the job only needs to push data.json / geocode-cache.json to main.
permissions:
  contents: write
  issues: write   # ouvrir un ticket quand un run échoue (item 29)

# Never run two updates at once (e.g. a manual run while the cron fires).
concurrency:
  group: daily-events-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The script fails (exit 1) if every scan fails or nothing valid comes back,
      # so a broken run never overwrites data.json. A run report is written to the job summary.
      # When the cadence guard skips the run it exits 0 without calling Gemini and without
      # touching data.json, so the commit step below simply finds nothing to publish.
      - name: Exécution du script de check Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          # URL CSV de la feuille de réponses du formulaire. En secret, pas en clair :
          # une réponse peut contenir le contact facultatif du visiteur, et le dépôt est public.
          # Secret absent = lecture du formulaire simplement désactivée, le scan continue.
          FEEDBACK_CSV_URL: ${{ secrets.FEEDBACK_CSV_URL }}
        run: node scripts/fetch-events.js

      # Pages statiques indexables (§3.X). Tourne aussi les jours sans scan : c'est ici que les
      # fiches des événements terminés disparaissent. Un échec ici ne doit jamais bloquer la
      # publication des données : le script calcule tout en mémoire avant d'écrire, donc un
      # plantage laisse les pages de la veille intactes.
      - name: Génération des pages statiques
        continue-on-error: true
        run: node scripts/generate-pages.js

      - name: Commit et Push automatique des nouvelles données
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"

          git add data.json
          if [ -f geocode-cache.json ]; then git add geocode-cache.json; fi
          # Sans ce cache, chaque run repartirait de zéro et retraduirait tout le catalogue.
          if [ -f translate-cache.json ]; then git add translate-cache.json; fi
          # Pages générées : chemins nommés un par un, jamais `git add -A` à la racine — le bot
          # publie sur main sans relecture, un fichier parasite partirait en ligne. `-A` sur ces
          # dossiers seulement, pour publier aussi les suppressions (événements terminés).
          git add sitemap.xml
          for d in evenements que-faire; do
            if [ -e "$d" ] || git ls-files --error-unmatch "$d" >/dev/null 2>&1; then git add -A -- "$d"; fi
          done
          if git diff --staged --quiet; then
            echo "Aucun changement dans les données — rien à publier."
            exit 0
          fi

          git commit -m "🤖 Auto-update data.json via Gemini Daily Check"

          # Retry with rebase in case main moved during the run (e.g. a manual push).
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Publié sur main (tentative $attempt)."
              exit 0
            fi
            echo "Push échoué (tentative $attempt), nouvel essai…"
            sleep $((attempt * 5))
          done

          echo "Impossible de publier sur main après 3 tentatives."
          exit 1

      # Le pipeline tourne sans surveillance et publie directement sur main. Le mail par défaut
      # de GitHub se perd ; un ticket se voit, se suit et se referme. Un seul ticket ouvert à la
      # fois : on ajoute un commentaire aux runs suivants plutôt que d'en empiler dix.
      - name: Ouvrir un ticket si le run a échoué
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 Échec de la collecte quotidienne";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Le workflow **${context.workflow}** a échoué.`,
              "",
              `- Run : ${url}`,
              `- Déclenché par : \`${context.eventName}\``,
              `- Commit : \`${context.sha.slice(0, 7)}\``,
              "",
              "`data.json` n'a pas été modifié : le site continue de servir les dernières données valides.",
              "Le détail des erreurs est dans le résumé du run.",
            ].join("\n");

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "collecte-en-echec",
            });

            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Nouvel échec : ${url}`,
              });
              core.notice(`Échec ajouté au ticket #${open[0].number}.`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["collecte-en-echec"],
            });
            core.notice(`Ticket #${issue.number} ouvert.`);