name: Check Quotidien & Mise à jour Data Gemini

# Le declencheur reste quotidien, mais le script ne lance un vrai scan (facture) que si les
# donnees ont plus de MIN_RUN_INTERVAL_HOURS (60 h) : soit environ un scan tous les 3 jours.
# Un jour saute ou echoue est ainsi retente des le lendemain, sans attendre 3 jours de plus.
# Un declenchement manuel force toujours le scan.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 07:00/08:00 in Paris
  workflow_dispatch:

# Least privilege: the job only needs to push data.json / geocode-cache.json to main.
permissions:
  contents: write

# Never run two updates at once (e.g. a manual run while the cron fires).
concurrency:
  group: daily-events-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The script fails (exit 1) if every scan fails or nothing valid comes back,
      # so a broken run never overwrites data.json. A run report is written to the job summary.
      # When the cadence guard skips the run it exits 0 without calling Gemini and without
      # touching data.json, so the commit step below simply finds nothing to publish.
      - name: Exécution du script de check Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/fetch-events.js

      - name: Commit et Push automatique des nouvelles données
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"

          git add data.json
          if [ -f geocode-cache.json ]; then git add geocode-cache.json; fi
          if git diff --staged --quiet; then
            echo "Aucun changement dans les données — rien à publier."
            exit 0
          fi

          git commit -m "🤖 Auto-update data.json via Gemini Daily Check"

          # Retry with rebase in case main moved during the run (e.g. a manual push).
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Publié sur main (tentative $attempt)."
              exit 0
            fi
            echo "Push échoué (tentative $attempt), nouvel essai…"
            sleep $((attempt * 5))
          done

          echo "Impossible de publier sur main après 3 tentatives."
          exit 1