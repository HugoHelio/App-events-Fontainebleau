name: Diagnostic de la recherche Google

# Pourquoi ce workflow existe : le 03/10, les quatre scans Gemini ont repondu sans aucune
# recherche Google (« no grounding metadata »), donc de memoire. La cle API n'existe que dans les
# secrets GitHub : ce bouton permet de tester sans la copier sur une machine.
#
# Un clic sur "Run workflow" dans l'onglet Actions. Lecture seule : rien n'est ecrit ni publie.
# Lance les cinq vrais scans (en deux temps, sec. 7 du 04/10 ; « villages » depuis le 05/10)
# sans rien publier. Cout : environ 0,25 $ par modele, une dizaine de minutes.
# Le resume s'ecrit au fur et a mesure : meme interrompu, il montre ce qui a deja tourne.
on:
  workflow_dispatch:
    inputs:
      modeles:
        description: "Modeles a tester, separes par des virgules (vide = celui du pipeline)"
        type: string
        default: ""
      scans:
        description: "Scans a tester, separes par des virgules (vide = les cinq ; ex. villages)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 10 min suffisaient a quatre scans (7 min le 04/10), plus a cinq : annule le 05/10.
    timeout-minutes: 25

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tester la recherche
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELES: ${{ inputs.modeles }}
          SCANS: ${{ inputs.scans }}
        run: |
          set --
          if [ -n "$MODELES" ]; then set -- "$@" --models "$MODELES"; fi
          if [ -n "$SCANS" ]; then set -- "$@" --scans "$SCANS"; fi
          node scripts/check-grounding.js "$@"
